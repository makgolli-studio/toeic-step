@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--green:#1d604c;--lime:#d9ee9b;--ink:#213d35;--muted:#718078;--bg:#f7f8f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Noto Sans KR',sans-serif}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid #d6a135;outline-offset:3px}header{height:86px;background:#fff;border-bottom:1px solid #e7ebe2;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.brand{font-weight:800;font-size:23px}.brand span{background:var(--green);color:#fff;border-radius:10px;padding:6px 10px;margin-right:9px}nav{display:flex;gap:28px}nav button{background:none;color:#718078;padding:12px 0}nav button.active{color:var(--green);font-weight:800;border-bottom:2px solid var(--green)}.tag{font-size:12px;padding:7px 12px;background:#eff5e7;border-radius:30px;color:var(--green)}main{max-width:1180px;margin:38px auto;padding:0 24px}.hero{background:#eaf0df;min-height:210px;border-radius:24px;padding:40px 44px;position:relative;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#537156}h1{font-size:36px;letter-spacing:-1.7px;line-height:1.5;margin:14px 0}p{line-height:1.8}.hero p{color:#647462;margin:0}.primary{background:var(--green);color:white;padding:14px 23px;border-radius:9px;font-weight:700}.hero .primary{margin-top:24px}.art{position:absolute;right:70px;top:45px;width:230px;height:210px;transform:rotate(-9deg)}.paper{background:#fffef5;box-shadow:0 14px 30px #52734920;border-radius:12px;padding:24px;height:180px;border:1px solid #d6dfc5}.paper b{font-size:36px;display:block}.paper i{height:7px;background:#dce5cf;display:block;margin-top:14px;border-radius:5px}.star{position:absolute;right:-22px;top:100px;background:var(--green);color:var(--lime);padding:12px 18px;border-radius:50%;font-size:35px}.grid{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:30px}h2{font-size:21px;margin:0 0 20px;letter-spacing:-.6px}h3{margin:0 0 10px;font-size:18px}.sub{font-size:13px;color:var(--muted)}.card{border:1px solid #e2e7db;background:#fff;border-radius:17px;padding:25px;margin-bottom:16px}.lesson{display:flex;gap:20px;align-items:center}.icon{font-size:25px;background:#f0f4e8;border-radius:12px;min-width:60px;height:60px;display:grid;place-items:center}.lesson .copy{flex:1}.lesson p{margin:4px 0;font-size:13px;color:var(--muted)}.outline{border:1px solid #d5dfcf;background:white;color:var(--green);border-radius:8px;padding:10px 16px;font-weight:600}.small{font-size:12px}.progress{height:7px;background:#edf0e8;border-radius:10px;margin:16px 0;overflow:hidden}.progress div{height:100%;background:#80a85c}.steps{list-style:none;padding:0;margin:0}.steps li{padding:13px 0;border-bottom:1px solid #eef0e9;display:flex;gap:12px;font-size:13px}.steps strong{color:#78946a}.note{background:#f0f3e7;color:#617453;padding:20px;border-radius:12px;line-height:1.8;font-size:13px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sectionhead h2{margin:0}.hidden{display:none!important}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chips button{padding:8px 14px;border-radius:20px;background:#edf2e6;color:var(--green)}.english{font-family:Georgia,serif;font-size:28px;line-height:1.6;color:#213d35}.word{background:none;color:var(--green);border-bottom:2px dotted #8ba57b;padding:1px 3px;font-family:inherit;font-size:inherit}.choice{display:block;width:100%;text-align:left;padding:16px;border:1px solid #dce3d6;border-radius:10px;background:white;margin:10px 0;color:var(--ink)}.choice:hover{background:#f2f6eb}.choice:disabled{cursor:default}.correct{background:#e4f2d9!important;border-color:#8cab6b}.wrong{background:#fff0e9!important;border-color:#d9a48c}.feedback{background:#f0f5e8;border-radius:12px;padding:20px;line-height:1.9;margin:20px 0}.vocabgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.vocabgrid .card{margin:0}.vocabgrid b{font:700 23px Georgia}.footer{font-size:12px;color:#889387;padding:28px 0;border-top:1px solid #e3e8dc;margin-top:24px}.stat{font-size:30px;font-weight:800}.back{background:none;color:var(--green);padding:0;margin-bottom:20px}@media(max-width:800px){header{height:auto;padding:18px 22px;flex-wrap:wrap;gap:14px}nav{gap:20px;order:3;width:100%;justify-content:space-between}header>.tag{display:none}main{margin:20px auto;padding:0 18px}.hero{padding:28px}h1{font-size:29px}.art{display:none}.grid{grid-template-columns:1fr}.lesson{gap:12px;padding:20px}.lesson .outline{padding:9px}.vocabgrid{grid-template-columns:repeat(2,1fr)}}
.budget-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.budget{border:1px solid #dce3d4;background:#fff;border-radius:12px;color:var(--green);padding:16px 10px;text-align:left}.budget b{display:block;font-size:23px}.budget span{display:block;font-size:11px;margin-top:8px}.budget.selected{background:#eaf3d8;border:2px solid var(--green)}.mission-list{list-style:none;padding:0}.mission-list li{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #edf0e7}.mission-list li>span:nth-child(2){flex:1}.mission-list small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.mission-check{width:30px;height:30px;display:grid;place-items:center;background:#eef3e6;border-radius:50%;color:var(--green)}.road{border-left:3px solid #dce4d4;padding:4px 0 8px 20px;margin-left:3px}.road.current{border-color:var(--green)}.road span{font-size:11px;color:#71846a}.road h3{margin:8px 0}.road p{font-size:13px;color:var(--muted);margin:4px 0 10px}.road b{font-size:12px;color:var(--green)}.save-row{display:flex;justify-content:space-between;gap:10px}.save-row .back{margin-bottom:15px}@media(max-width:480px){.budget-options{gap:6px}.budget{padding:12px 8px}.budget b{font-size:20px}.budget span{font-size:10px}.mission-list .outline{padding:8px 10px}}
.studio-credit{max-width:1180px;margin:12px auto 0;padding:0 24px;text-align:right;color:#6d7d65;font-size:12px;letter-spacing:.3px}.guided-entry{margin-top:24px;background:#eef3e4;border-color:#d8e3ca}.guide-steps{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 22px}.guide-steps span{padding:8px 12px;font-size:12px;background:#e9ede2;border-radius:20px;color:#687961}.guide-steps span.current{background:var(--green);color:white}.guide-sentence{font-size:25px;overflow-wrap:anywhere}.guide-vocab{margin:20px 0}.guide-vocab div{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:13px 0;border-bottom:1px solid #e8ecdf}.guide-vocab dt{font-weight:700}.guide-vocab dd{margin:0;color:#607355}mark{background:#dfedbc;color:inherit;padding:2px 5px;border-radius:4px}summary{cursor:pointer;color:var(--green);padding:10px 0}@media(max-width:480px){.guide-sentence{font-size:21px}.guide-vocab div{grid-template-columns:1fr;gap:5px}}.study-intro{padding:12px 0 24px;border-bottom:1px solid #e1e7db;margin-bottom:24px}.study-intro h1{font-size:32px;margin:9px 0}.study-intro p{color:#647269;margin:0}.study-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.study-layout .guided-entry{margin-top:0;background:#fff}.study-links{display:grid;grid-template-columns:1fr 1fr;gap:16px}.study-sequence{padding-left:22px;display:flex;gap:28px;flex-wrap:wrap;color:#66765e;font-size:12px;margin:20px 0}.record-list{margin:22px 0}.record-list div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ecf0e5;font-size:13px}.record-list dd{margin:0;font-weight:700}.budget b{font-size:20px}header{height:auto;min-height:80px;gap:16px;padding-top:16px;padding-bottom:16px}@media(max-width:800px){.study-layout{grid-template-columns:1fr}.study-links{grid-template-columns:1fr}.study-sequence{display:block;line-height:2.2}.study-intro h1{font-size:27px}.brand{font-size:21px}.budget b{font-size:18px}}
</style><header><div class="brand">토익 공부 노트</div><nav aria-label="주 메뉴"><button data-view="home" class="active">내 학습</button><button data-view="vocab">기초 어휘</button><button data-view="grammar">기초 문법</button><button data-view="review">오답 복습</button></nav><div class="tag">어휘 · 문법 · 독해</div></header><div class="studio-credit">makgolli studio 출품</div><main id="app"></main><script>
const words=[['employee','직원','The employee works here.','그 직원은 여기서 일합니다.'],['meeting','회의','The meeting starts at nine.','회의는 9시에 시작합니다.'],['schedule','일정','Check the schedule.','일정을 확인하세요.'],['purchase','구매하다; 구매','We purchase office supplies.','우리는 사무용품을 구매합니다.'],['available','이용 가능한; 시간이 있는','A room is available.','이용 가능한 방이 있습니다.'],['customer','고객','The customer needs help.','그 고객은 도움이 필요합니다.'],['submit','제출하다','Please submit the form.','양식을 제출해 주세요.'],['application','신청서; 지원','Complete the application.','신청서를 작성하세요.'],['department','부서','She works in the sales department.','그녀는 영업 부서에서 일합니다.'],['invoice','청구서','Please check the invoice.','청구서를 확인해 주세요.'],['appointment','약속; 예약','I have an appointment.','저는 약속이 있습니다.'],['delay','지연; 지연시키다','There is a delay.','지연이 있습니다.'],['where','어디에; 어디에서','Where is the office?','사무실은 어디에 있나요?'],['when','언제','When does it start?','그것은 언제 시작하나요?'],['who','누구','Who is the manager?','관리자는 누구인가요?'],['why','왜','Why is it closed?','그곳은 왜 닫혀 있나요?'],['how','어떻게','How can I apply?','어떻게 신청할 수 있나요?'],['refer to','~을 참고하다','Refer to the schedule.','일정을 참고하세요.'],['according to','~에 따르면','According to the notice, it is closed.','공지에 따르면 그곳은 문을 닫았습니다.'],['most likely','가장 가능성이 높은','Who is most likely the speaker?','말하는 사람은 누구일 가능성이 가장 높나요?'],['notice','공지; 알아차리다','Read the notice.','공지를 읽으세요.'],['offer','제공하다; 제안','We offer free delivery.','저희는 무료 배송을 제공합니다.'],['attend','참석하다','Please attend the meeting.','회의에 참석해 주세요.'],['by','~까지; ~에 의해','Submit it by Friday.','금요일까지 그것을 제출하세요.']];
const qs=[{type:'문법 · be동사',en:'The employees ___ in the office.',ko:'직원들은 / ~에 있습니다 / 사무실에.',opts:['is','are','be','am'],a:1,why:'employees는 직원 여러 명을 뜻하는 복수 주어입니다. 현재형 be동사는 are를 씁니다. is는 단수 주어, am은 I와 함께 씁니다. be는 원형이라 이 문장의 현재형 자리에 바로 쓸 수 없습니다.',key:'employee = 직원 · office = 사무실'}, {type:'어휘 · 동작',en:'Please ___ the application by Friday.',ko:'부디 / 신청서를 제출하세요 / 금요일까지.',opts:['submit','attend','available','employee'],a:0,why:'빈칸은 「신청서(application)를 ~하다」라는 동작 자리입니다. submit은 제출하다, attend는 참석하다, available은 이용 가능한, employee는 직원입니다. 명령문은 동사원형으로 시작합니다.',key:'application = 신청서 · by Friday = 금요일까지'}, {type:'질문 이해 · When',en:'When does the meeting start?',ko:'언제 / 회의가 / 시작하나요?',opts:['In Room 201.','At 9 a.m.','Ms. Kim.','To discuss the budget.'],a:1,why:'When은 시간을 묻습니다. At 9 a.m.은 오전 9시에라는 뜻입니다. In Room 201은 장소, Ms. Kim은 사람, To discuss the budget은 예산을 논의하기 위해서라는 목적입니다.',key:'when = 언제 · meeting = 회의 · start = 시작하다'}, {type:'문법 · 주어와 동사',en:'She ___ in the sales department.',ko:'그녀는 / 일합니다 / 영업 부서에서.',opts:['work','working','works','to work'],a:2,why:'현재의 사실이나 습관을 말할 때, 주어가 she/he/it처럼 3인칭 단수이면 일반동사에 -s를 붙입니다. working은 이 문장에서 is가 필요하고, to work는 혼자 서술어가 될 수 없습니다.',key:'sales = 영업 · department = 부서'}, {type:'질문 이해 · Where',en:'Where can I purchase a ticket?',ko:'어디에서 / 저는 표를 구매할 수 있나요?',opts:['Tomorrow morning.','At the front desk.','Ten dollars.','Mr. Lee.'],a:1,why:'Where는 장소를 묻습니다. At the front desk는 안내 데스크에서라는 장소 표현입니다. 나머지는 각각 시간, 금액, 사람을 나타냅니다.',key:'purchase = 구매하다 · ticket = 표 · front desk = 안내 데스크'}, {type:'문법 · 형용사',en:'A meeting room is ___.',ko:'회의실 하나가 / 이용 가능합니다.',opts:['availability','available','availably','avails'],a:1,why:'be동사 is 뒤에서 주어의 상태를 설명하는 형용사가 필요합니다. available은 이용 가능한이라는 형용사이고, availability는 이용 가능성이라는 명사입니다. availably는 이 문장에서 쓰지 않는 형태이며 avails는 동사 형태입니다.',key:'meeting room = 회의실 · available = 이용 가능한'}, {type:'질문 이해 · Who',en:'Who should attend the meeting?',ko:'누가 / 회의에 참석해야 하나요?',opts:['All employees.','At noon.','In the lobby.','Every Monday.'],a:0,why:'Who는 사람을 묻습니다. All employees는 모든 직원이라는 뜻입니다. should는 ~해야 한다는 뜻이고, 뒤에는 동사원형 attend가 옵니다.',key:'who = 누구 · attend = 참석하다 · all = 모든'}, {type:'짧은 독해 · 공지',en:'The office is closed on Monday. It opens on Tuesday.',ko:'사무실은 월요일에 문을 닫습니다. / 화요일에 문을 엽니다.',prompt:'When does the office open?',opts:['On Monday.','On Tuesday.','At the station.','The manager.'],a:1,why:'질문은 사무실이 언제 문을 여는지 묻습니다. 두 번째 문장의 opens on Tuesday가 근거입니다. closed(닫힌)와 opens(연다)를 구별하세요.',key:'closed = 닫힌 · open = 열다 · Tuesday = 화요일'}];
let saved;try{saved=JSON.parse(localStorage.getItem('toeic-step-v1'))}catch{}let state=saved||{done:[],wrong:[],known:[],attempts:0};let view='home',mode='',queue=[],pos=0,answered=false,sessionRight=0;const app=document.querySelector('#app');const save=()=>{try{localStorage.setItem('toeic-step-v1',JSON.stringify(state))}catch{}};const btn=(text,fn,cl='outline')=>`<button class="${cl}" onclick="${fn}">${text}</button>`;
function shell(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}function go(v){view=v;shell();render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
function render(){if(view==='vocab')app.innerHTML=`<h2>기초 어휘 노트</h2><p class="sub">뜻 → 예문 → 다시 떠올리기. 외웠다면 체크해 주세요.</p><div class="chips">${['전체','업무 단어','질문 표현'].map((t,i)=>btn(t,`vocabFilter(${i})`)).join('')}</div><div class="vocabgrid" id="words"></div>`;
if(view==='vocab')vocabFilter(0);
if(view==='grammar')app.innerHTML=`<h2>문법의 첫 단추</h2><p class="sub">이름을 외우기보다, 문장에서 어떤 일을 하는지 살펴보세요.</p>${[['01','주어 + 동사: 누가, 무엇을 하나요?','<b>Employees work.</b> 직원들은 일합니다.<br>Employees = 누가? → 주어 / work = 무엇을 하나요? → 동사<br>영어는 보통 「누가 → 한다 → 무엇을」 순서로 읽어요. <b>We check the schedule.</b> 우리는 / 확인해요 / 일정을.'],['02','be동사: ~이다, ~에 있다','<b>I am / He·She·It is / You·We·They are</b><br>She is a manager. 그녀는 관리자입니다.<br>They are in the office. 그들은 사무실에 있습니다.<br>일반동사와 구별하세요: She works. (○) She is work. (×)'],['03','현재형: 한 명이면 동사에 -s','<b>They work. → She works.</b><br>평소 하는 일이나 현재 사실을 말할 때 he, she, it 등 3인칭 단수 주어 뒤의 일반동사에 -s/-es를 붙여요.<br>He attends the meeting. 그는 회의에 참석합니다.'],['04','형용사: 어떤 상태인가요?','<b>The room is available.</b> 그 방은 이용 가능합니다.<br>available은 방의 상태를 설명해요. 형용사는 명사 앞에서도 쓰입니다: <b>an available room</b> 이용 가능한 방.'],['05','질문 단어부터 먼저 보기','<b>Who → 누구 / When → 언제 / Where → 어디 / Why → 왜 / How → 어떻게</b><br>When does the meeting start? → 회의가 언제 시작하나요?<br>does는 질문을 만드는 조동사예요. 뒤의 start는 원형으로 써요. 시간 정보를 찾아 답하세요.']].map(x=>`<article class="card"><span class="eyebrow">LESSON ${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}${btn('배운 문법 연습하기 →',"start('grammar')",'primary')}`;
if(view==='review')app.innerHTML=`<h2>오답 복습</h2><div class="card"><h3>복습할 문제 ${state.wrong.length}개</h3><p>틀린 문제를 다시 맞히면 오답 목록에서 빠져요.</p>${state.wrong.length?btn('오답 연습 시작 →',"start('review')",'primary'):'<p class="note">아직 남아 있는 오답이 없어요. 오늘의 학습을 시작해 보세요.</p>'+btn('문제 풀기',"start('daily')")}</div><p class="sub">저장된 기록: 정답을 맞힌 문제 ${state.done.length}개 · 총 응답 ${state.attempts}회</p>${btn('학습 기록 초기화',"resetProgress()")}`;app.innerHTML+='<footer class="footer">한 걸음 TOEIC<br>makgolli studio 출품<br>자체 제작 기초 연습 자료이며 공식 TOEIC 문항이 아닙니다. 현재 버전은 어휘·문법·짧은 독해 중심입니다.</footer>'}
function vocabFilter(f){document.querySelector('#words').innerHTML=words.map((w,i)=>({w,i})).filter(({i})=>!f||(f===1?i<12||i>19:i>=12&&i<=19)).map(({w,i})=>`<article class="card"><b>${w[0]}</b><p>${w[1]}</p><p class="sub">${w[2]}<br>${w[3]}</p>${btn(state.known.includes(i)?'✓ 외웠어요':'외웠어요',`known(${i},${f})`)}</article>`).join('')}function known(i,f){state.known=state.known.includes(i)?state.known.filter(x=>x!==i):[...state.known,i];save();vocabFilter(f)}
function start(m){mode=m;queue=m==='review'?[...state.wrong]:m==='question'?[2,4,6,7]:m==='grammar'?[0,3,5]:m==='diagnostic'?[0,1,2,7]:[0,1,2,3,4];pos=0;sessionRight=0;view='quiz';shell();showQ();window.scrollTo(0,0)}

lass="sub">${words.length}개 단어·표현의 뜻과 예문</p>${btn('어휘 보기',"go('vocab')")}</article><article class="card"><h3>문법 설명</h3><p class="sub">주어·동사, be동사, 현재형, 형용사, 질문 표현, 명사 꾸미기</p>${btn('문법 보기',"go('grammar')")}</article></div></section><aside><article class="card"><h3>저장된 학습 기록</h3><dl class="record-list"><div><dt>완료한 기초 단원</dt><dd>${f.completed.length} / ${units.length}</dd></div><div><dt>외웠다고 표시한 단어</dt><dd>${state.known.length}개</dd></div><div><dt>복습할 문제</dt><dd>${state.wrong.length}개</dd></div></dl>${btn('오답 복습',"go('review')",'primary')}<p class="sub">단원 완료는 활동을 마쳤다는 뜻입니다. 실제 시험 점수로 환산하지 않습니다.</p></article><article class="card"><h3>이용 방법</h3><p class="sub">모르는 단어는 뜻을 확인하세요.<br>문장이 길면 주어와 동사부터 찾으세요.<br>답을 고른 뒤에는 해설을 확인하세요.</p><p class="sub">기록은 이 브라우저에 저장됩니다. 다른 기기와 동기화되지 않습니다.</p></article></aside></div><footer class="footer">makgolli studio 출품<br>자체 제작 어휘·문법·독해 연습 자료입니다. 공식 TOEIC 문항이 아닙니다.</footer>`}
